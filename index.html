<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Cinzel:ital,wght@0,400;0,600;1,400&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1 class="heading">Expense Tracker</h1>
            <nav class="nav">
                <button class="nav-btn active" data-page="add">Add Transaction</button>
                <button class="nav-btn" data-page="dashboard">Dashboard</button>
            </nav>
        </header>

        <!-- Add Transaction Page -->
        <div id="add-page" class="page active">
            <div class="card">
                <h2 class="subheading">Add New Transaction</h2>
                
                <form id="expenseForm" class="form">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="label">Date</label>
                            <input type="date" id="date" class="input" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="label">Account</label>
                            <select id="account" class="input" required>
                                <option value="">Select Account</option>
                                <option>CANARA BANK</option>
                                <option>ICICI SAVINGS</option>
                                <option>HDFC</option>
                                <option>SBI</option>
                                <option>ICICI CURRENT</option>
                                <option>KVB</option>
                                <option>ZAGGLE</option>
                                <option>PAV CNB</option>
                                <option>PAV IOB</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="label">Income (₹)</label>
                            <input type="number" id="income" class="input" value="0" step="0.01" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="label">Expense (₹)</label>
                            <input type="number" id="expense" class="input" value="0" step="0.01" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="label">Expense Type</label>
                        <select id="type" class="input" required>
                            <option value="">Select Type</option>
                            <option>RENT - OUT</option>
                            <option>HOUSEHOLD EXPENSE</option>
                            <option>MEDICAL</option>
                            <option>FUEL & TRAVEL</option>
                            <option>MISC</option>
                            <option>SALARY</option>
                            <option>HAND LOAN</option>
                            <option>HL EMI</option>
                            <option>PL EMI</option>
                            <option>SELF TRANSFER - IN</option>
                            <option>ONLINE PURCHASE</option>
                            <option>CLOTHINGS</option>
                            <option>FOOD ORDERS</option>
                            <option>BANK CHARGES</option>
                            <option>INITIAL BALANCE</option>
                            <option>TEA & SNACKS</option>
                            <option>INCOME OTHERS</option>
                            <option>CREDIT CARD PAYMENT</option>
                            <option>VEHICLE SERVICE</option>
                            <option>MOBILE & INTERNET</option>
                            <option>EXPENSE CLAIMABLE</option>
                            <option>RENT - IN</option>
                            <option>LOAN</option>
                            <option>INSURANCE</option>
                            <option>SIP</option>
                            <option>SELF TRANSFER - OUT</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="label">Remarks</label>
                        <textarea id="remarks" class="input textarea" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        <span class="btn-icon">+</span>
                        Save Transaction
                    </button>
                </form>

                <div id="status" class="status"></div>
            </div>
        </div>

        <!-- Dashboard Page -->
        <div id="dashboard-page" class="page">
            <div class="dashboard-grid">
                <!-- Summary Cards -->
                <div class="summary-cards">
                    <div class="summary-card balance">
                        <div class="summary-icon">₹</div>
                        <div class="summary-content">
                            <div class="summary-label">Total Balance</div>
                            <div class="summary-value" id="totalBalance">0</div>
                        </div>
                    </div>
                    
                    <div class="summary-card income">
                        <div class="summary-icon">↑</div>
                        <div class="summary-content">
                            <div class="summary-label">Total Income</div>
                            <div class="summary-value" id="totalIncome">0</div>
                        </div>
                    </div>
                    
                    <div class="summary-card expense">
                        <div class="summary-icon">↓</div>
                        <div class="summary-content">
                            <div class="summary-label">Total Expense</div>
                            <div class="summary-value" id="totalExpense">0</div>
                        </div>
                    </div>
                </div>

                <!-- Charts -->
                <div class="charts-section">
                    <div class="card chart-card">
                        <h3 class="title">Expense by Category</h3>
                        <canvas id="expensePieChart"></canvas>
                    </div>
                    
                    <div class="card chart-card">
                        <h3 class="title">Monthly Expenses</h3>
                        <canvas id="monthlyChart"></canvas>
                    </div>
                </div>

                <!-- Filters -->
                <div class="card filters-card">
                    <h3 class="title">Filters</h3>
                    <div class="filters-grid">
                        <div class="form-group">
                            <label class="label">Account</label>
                            <select id="accountFilter" class="input">
                                <option value="">All Accounts</option>
                                <option>CANARA BANK</option>
                                <option>ICICI SAVINGS</option>
                                <option>HDFC</option>
                                <option>SBI</option>
                                <option>ICICI CURRENT</option>
                                <option>KVB</option>
                                <option>ZAGGLE</option>
                                <option>PAV CNB</option>
                                <option>PAV IOB</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="label">Type</label>
                            <select id="typeFilter" class="input">
                                <option value="">All Types</option>
                                <option>RENT - OUT</option>
                                <option>HOUSEHOLD EXPENSE</option>
                                <option>MEDICAL</option>
                                <option>FUEL & TRAVEL</option>
                                <option>MISC</option>
                                <option>SALARY</option>
                                <option>ONLINE PURCHASE</option>
                                <option>FOOD ORDERS</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Transactions Table -->
                <div class="card table-card">
                    <h3 class="title">Recent Transactions</h3>
                    <div class="table-container">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Account</th>
                                    <th>Income</th>
                                    <th>Expense</th>
                                    <th>Type</th>
                                    <th>Total</th>
                                    <th>Remarks</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
